<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="100"
   height="100"
   viewBox="0 0 100 100"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalistic speaker icon, pointing right (towards center) -->
  <!-- Same style as head.svg: flat grey #b3b3b3 -->
  <g id="speaker" transform="translate(50,50)">
    <!-- Speaker body (small rectangle) -->
    <rect
       style="fill:#b3b3b3;stroke:none"
       x="-8"
       y="-8"
       width="12"
       height="16"
       rx="1"
       ry="1" />
    <!-- Speaker cone/horn (trapezoid as polygon pointing right) -->
    <polygon
       style="fill:#b3b3b3;stroke:none"
       points="4,-8 18,-16 18,16 4,8" />
  </g>
</svg>
