# The ILITEK panel presents itself twice: as a 10-finger touch device with the
# right rotation for this portrait screen, and as a single-pointer mouse
# emulation with none. A finger then produces two streams — one where it is
# and one somewhere else — which drags things in the UI two ways at once.
#
# The emulation offers nothing the touch device does not: fewer contacts, and
# the wrong coordinates. Ignored here rather than disabled by hand, because a
# hand-disabled device comes back the next time it re-enumerates.

Section "InputClass"
    Identifier  "ILITEK mouse emulation off"
    MatchProduct "ILITEK       ILITEK-TOUCH Mouse"
    Option      "Ignore" "on"
EndSection
