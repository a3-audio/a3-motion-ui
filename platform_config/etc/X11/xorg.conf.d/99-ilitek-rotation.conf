# Das Panel haengt gedreht (xrandr: HDMI-2 ... right), und die passende
# Transformationsmatrix ist eine Laufzeit-Eigenschaft des X-Geraets. Beim
# Ab- und Anstecken enumeriert das Panel neu und verliert sie -- die
# Beruehrungen landen dann 90 Grad verdreht, was sich anfuehlt, als ginge
# der Touchscreen gar nicht.
#
# Ueber MatchProduct statt ueber die Geraete-ID: die ID wechselt bei jedem
# Neu-Enumerieren, der Name nicht.
Section "InputClass"
    Identifier   "ILITEK touch rotation"
    MatchProduct "ILITEK       ILITEK-TOUCH"
    MatchIsTouchscreen "on"
    Driver       "libinput"
    Option       "TransformationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
